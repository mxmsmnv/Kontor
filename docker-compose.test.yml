services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kontor_test
      MYSQL_USER: kontor
      MYSQL_PASSWORD: kontor
    ports:
      - "3399:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ukontor", "-pkontor"]
      interval: 5s
      timeout: 5s
      retries: 10
